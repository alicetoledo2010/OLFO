<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOLEDO - Sua Inteligência para Estudar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fff5fa, #fde4f0);
            color: #3d1830;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #7b174f, #b52b72);
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(123, 23, 79, 0.25);
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .logo span {
            color: #ffd1e6;
        }

        .header-text {
            color: #ffeaf4;
            font-size: 14px;
        }

        .chat-container {
            width: 90%;
            max-width: 900px;
            height: 75vh;
            margin: 40px auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(123, 23, 79, 0.18);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #f5c5db;
        }

        .chat-top {
            background: linear-gradient(135deg, #9d1f61, #d64d91);
            color: white;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .robot {
            width: 55px;
            height: 55px;
            background: #ffd1e6;
            color: #8a1855;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 12px rgba(80, 0, 45, 0.15);
        }

        .chat-top h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .chat-top p {
            font-size: 13px;
            color: #ffeaf4;
        }

        .messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #fffafd;
        }

        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 15px;
        }

        .toledo-message {
            align-self: flex-start;
            background: #fce7f1;
            color: #4a2039;
            border-bottom-left-radius: 5px;
            border: 1px solid #f5ccdf;
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #8c1957, #b52b72);
            color: white;
            border-bottom-right-radius: 5px;
            box-shadow: 0 4px 10px rgba(123, 23, 79, 0.15);
        }

        .input-area {
            padding: 18px;
            border-top: 1px solid #f3d5e3;
            display: flex;
            gap: 10px;
            background: #fff;
        }

        .input-area input {
            flex: 1;
            padding: 15px 18px;
            border: 2px solid #efc5d9;
            border-radius: 14px;
            outline: none;
            font-size: 15px;
            color: #4a2039;
            background: #fffafd;
        }

        .input-area input:focus {
            border-color: #c3387e;
            box-shadow: 0 0 0 3px rgba(195, 56, 126, 0.1);
        }

        .send-button {
            background: linear-gradient(135deg, #d84b91, #a51f64);
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 14px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            box-shadow: 0 5px 12px rgba(165, 31, 100, 0.2);
        }

        .send-button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .new-chat {
            text-align: center;
            margin-bottom: 30px;
        }

        .new-chat button {
            background: white;
            border: 2px solid #a51f64;
            color: #8c1957;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .new-chat button:hover {
            background: #a51f64;
            color: white;
        }

        @media (max-width: 600px) {
            .chat-container {
                width: 95%;
                height: 80vh;
                margin: 20px auto;
            }

            .header-text {
                display: none;
            }

            .message {
                max-width: 85%;
            }

            .input-area {
                padding: 12px;
            }

            .send-button {
                padding: 0 16px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">TO<span>L</span>EDO</div>
    <div class="header-text">Sua inteligência para estudar 📚</div>
</header>

<div class="chat-container">

    <div class="chat-top">
        <div class="robot">🧠</div>

        <div>
            <h1>Olá! Eu sou a TOLEDO 👋</h1>
            <p>Estou aqui para ajudar você a aprender.</p>
        </div>
    </div>

    <div class="messages" id="messages">

        <div class="message toledo-message">
            Olá! 👋 Eu sou a <strong>TOLEDO</strong>.
            <br><br>
            Pode me perguntar qualquer coisa sobre seus estudos.
            Vou tentar explicar de uma maneira simples e passo a passo! 📚✨
        </div>

    </div>

    <div class="input-area">

        <input
            type="text"
            id="userInput"
            placeholder="Digite sua pergunta..."
            onkeydown="if(event.key === 'Enter') enviarMensagem()"
        >

        <button class="send-button" onclick="enviarMensagem()">
            Enviar
        </button>

    </div>

</div>

<div class="new-chat">
    <button onclick="novaConversa()">
        🔄 Nova conversa
    </button>
</div>

<script>

function enviarMensagem() {

    const input = document.getElementById("userInput");
    const messages = document.getElementById("messages");

    const pergunta = input.value.trim();

    if (pergunta === "") {
        return;
    }

    const mensagemUsuario = document.createElement("div");
    mensagemUsuario.className = "message user-message";
    mensagemUsuario.textContent = pergunta;

    messages.appendChild(mensagemUsuario);

    input.value = "";

    const mensagemToledo = document.createElement("div");
    mensagemToledo.className = "message toledo-message";

    mensagemToledo.innerHTML =
        "Recebi sua pergunta! 🤖💗<br><br>" +
        "Ainda estou sendo preparada para responder de verdade. " +
        "Em breve vou poder explicar esse assunto para você passo a passo! 📚✨";

    messages.appendChild(mensagemToledo);

    messages.scrollTop = messages.scrollHeight;
}

function novaConversa() {

    const messages = document.getElementById("messages");

    messages.innerHTML = `
        <div class="message toledo-message">
            Olá novamente! 👋
            <br><br>
            Vamos começar uma nova conversa. O que você quer estudar hoje? 📚✨
        </div>
    `;
}

</script>

</body>
</html>
