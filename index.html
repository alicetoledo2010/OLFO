<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOLEDO - Sua Inteligência para Estudar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #172033;
            min-height: 100vh;
        }

        header {
            background: #101c3a;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .logo span {
            color: #f4c542;
        }

        .header-text {
            color: #dce3f2;
            font-size: 14px;
        }

        .chat-container {
            width: 90%;
            max-width: 900px;
            height: 75vh;
            margin: 40px auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .chat-top {
            background: linear-gradient(135deg, #101c3a, #1c3768);
            color: white;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .robot {
            width: 55px;
            height: 55px;
            background: #f4c542;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .chat-top h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .chat-top p {
            font-size: 13px;
            color: #dce3f2;
        }

        .messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 15px;
        }

        .toledo-message {
            align-self: flex-start;
            background: #eef2f8;
            color: #172033;
            border-bottom-left-radius: 4px;
        }

        .user-message {
            align-self: flex-end;
            background: #101c3a;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .input-area {
            padding: 18px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
            background: white;
        }

        .input-area input {
            flex: 1;
            padding: 15px 18px;
            border: 2px solid #e1e5ec;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
        }

        .input-area input:focus {
            border-color: #1c3768;
        }

        .send-button {
            background: #f4c542;
            color: #101c3a;
            border: none;
            padding: 0 25px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .send-button:hover {
            opacity: 0.9;
        }

        .new-chat {
            text-align: center;
            margin-bottom: 30px;
        }

        .new-chat button {
            background: transparent;
            border: 2px solid #101c3a;
            color: #101c3a;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .chat-container {
                width: 95%;
                height: 80vh;
                margin: 20px auto;
            }

            .header-text {
                display: none;
            }

            .message {
                max-width: 85%;
            }

            .input-area {
                padding: 12px;
            }

            .send-button {
                padding: 0 16px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">TO<span>L</span>EDO</div>
    <div class="header-text">Sua inteligência para estudar 📚</div>
</header>

<div class="chat-container">

    <div class="chat-top">
        <div class="robot">🧠</div>

        <div>
            <h1>Olá! Eu sou a TOLEDO 👋</h1>
            <p>Estou aqui para ajudar você a aprender.</p>
        </div>
    </div>

    <div class="messages" id="messages">

        <div class="message toledo-message">
            Olá! 👋 Eu sou a <strong>TOLEDO</strong>.
            <br><br>
            Pode me perguntar qualquer coisa sobre seus estudos.
            Vou tentar explicar de uma maneira simples e passo a passo! 📚✨
        </div>

    </div>

    <div class="input-area">

        <input
            type="text"
            id="userInput"
            placeholder="Digite sua pergunta..."
            onkeydown="if(event.key === 'Enter') enviarMensagem()"
        >

        <button class="send-button" onclick="enviarMensagem()">
            Enviar
        </button>

    </div>

</div>

<div class="new-chat">
    <button onclick="novaConversa()">
        🔄 Nova conversa
    </button>
</div>

<script>

function enviarMensagem() {

    const input = document.getElementById("userInput");
    const messages = document.getElementById("messages");

    const pergunta = input.value.trim();

    if (pergunta === "") {
        return;
    }

    const mensagemUsuario = document.createElement("div");
    mensagemUsuario.className = "message user-message";
    mensagemUsuario.textContent = pergunta;

    messages.appendChild(mensagemUsuario);

    input.value = "";

    const mensagemToledo = document.createElement("div");
    mensagemToledo.className = "message toledo-message";

    mensagemToledo.innerHTML =
        "Recebi sua pergunta! 🤖💙<br><br>" +
        "Ainda estou sendo preparada para responder de verdade. " +
        "Em breve vou poder explicar esse assunto para você passo a passo! 📚";

    messages.appendChild(mensagemToledo);

    messages.scrollTop = messages.scrollHeight;
}

function novaConversa() {

    const messages = document.getElementById("messages");

    messages.innerHTML = `
        <div class="message toledo-message">
            Olá novamente! 👋
            <br><br>
            Vamos começar uma nova conversa. O que você quer estudar hoje? 📚✨
        </div>
    `;
}

</script>

</body>
</html>
